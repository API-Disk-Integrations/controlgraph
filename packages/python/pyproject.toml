[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "controlgraph-api"
version = "1.0.0"
description = "Detect regulatory changes and map them to obligations, policies, controls, products and evidence requirements."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "controlgraph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://controlgraph-api.com/"
Documentation = "https://controlgraph-api.com/#docs"
Pricing = "https://controlgraph-api.com/#pricing"
Privacy = "https://controlgraph-api.com/privacy"
Terms = "https://controlgraph-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/controlgraph"
Issues = "https://github.com/API-Disk-Integrations/controlgraph/issues"
Changelog = "https://github.com/API-Disk-Integrations/controlgraph/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/regulation_control"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/regulation_control/__init__.py",
]
